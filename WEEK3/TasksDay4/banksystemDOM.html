<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank System</title>

    <style>
        body{
            font-family: Arial;
            margin:20px;
        }

        input{
            margin:5px;
            padding:8px;
        }

        button{
            padding:8px 12px;
            margin:5px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        th,td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }
    </style>
</head>
<body>

<h2>Bank System</h2>

<input type="number" id="id" placeholder="ID">
<input type="text" id="name" placeholder="Name">
<input type="number" id="balance" placeholder="Balance">

<br>

<button onclick="addUser()">Add User</button>
<button onclick="editUserBalanceById()">Edit Balance</button>
<button onclick="transferBalance()">Transfer</button>
<button onclick="deleteUserById()">Delete User</button>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Balance</th>
        </tr>
    </thead>

    <tbody id="tableBody">

    </tbody>
</table>

<script src="BSDOM.js"></script>

</body>
</html>
